<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Internal Tools — Operations Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* ============ DESIGN TOKENS ============ */
    :root {
      --bg:#f6f7f9; --surface:#ffffff; --surface-2:#f1f3f5; --border:#e4e7eb;
      --text:#1a2027; --text-muted:#5b6672; --text-subtle:#98a1ac;
      --accent:#2563eb; --accent-hover:#1d4ed8; --accent-soft:#eef4ff;
      --public:#15803d; --public-soft:#e8f6ee;
      --internal:#b45309; --internal-soft:#fdf3e6;
      --restricted:#b91c1c; --restricted-soft:#fdecec;
      --radius-sm:6px; --radius:9px; --radius-lg:14px;
      --shadow-sm:0 1px 2px rgba(16,24,40,.05); --shadow-md:0 4px 12px rgba(16,24,40,.08);
      --font-sans:'Inter',system-ui,sans-serif; --font-mono:'JetBrains Mono',monospace;
    }
    :root[data-theme="dark"] {
      --bg:#0e1217; --surface:#161b22; --surface-2:#1f262e; --border:#2a323c;
      --text:#e6e9ee; --text-muted:#9aa4b0; --text-subtle:#69727e;
      --accent:#3b82f6; --accent-hover:#60a5fa; --accent-soft:#17263f;
      --public:#4ade80; --public-soft:#12301e;
      --internal:#fbbf24; --internal-soft:#332711;
      --restricted:#f87171; --restricted-soft:#341a1a;
      --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow-md:0 4px 12px rgba(0,0,0,.45);
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:var(--font-sans); background:var(--bg); color:var(--text); line-height:1.5; -webkit-font-smoothing:antialiased; transition:background .2s,color .2s; }

    /* ============ APP SHELL ============ */
    .app { display:grid; grid-template-columns:244px 1fr; min-height:100vh; }
    .sidebar { background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; padding:20px 14px; }
    .brand { display:flex; align-items:center; gap:10px; padding:6px 8px 22px; }
    .brand-mark { width:30px; height:30px; border-radius:8px; background:var(--accent); color:#fff; display:grid; place-items:center; }
    .brand-mark svg { width:19px; height:19px; }
    .brand-name { font-weight:700; font-size:17px; letter-spacing:-.01em; }
    .brand-name span { color:var(--accent); }
    .nav { display:flex; flex-direction:column; gap:2px; }
    .nav-label { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--text-subtle); padding:8px 10px 4px; }
    .nav-item { display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:var(--radius-sm); color:var(--text-muted); font-size:14px; font-weight:500; cursor:pointer; border:none; background:none; width:100%; text-align:left; font-family:inherit; transition:background .15s,color .15s; }
    .nav-item:hover { background:var(--surface-2); color:var(--text); }
    .nav-item.active { background:var(--accent-soft); color:var(--accent); }
    .nav-item svg { width:18px; height:18px; flex-shrink:0; }
    .sidebar-footer { margin-top:auto; padding-top:16px; border-top:1px solid var(--border); }
    .identity { display:flex; align-items:center; gap:10px; padding:6px 8px; }
    .avatar { width:34px; height:34px; border-radius:50%; background:var(--surface-2); display:grid; place-items:center; font-weight:600; font-size:13px; color:var(--text-muted); }
    .identity-name { font-weight:600; font-size:13px; }
    .identity-role { color:var(--text-subtle); font-size:12px; }
    .main { display:flex; flex-direction:column; min-width:0; }
    .topbar { display:flex; align-items:center; justify-content:space-between; padding:16px 28px; border-bottom:1px solid var(--border); background:var(--surface); }
    .page-title { font-size:19px; font-weight:600; letter-spacing:-.01em; }
    .page-sub { font-size:13px; color:var(--text-muted); margin-top:1px; }
    .topbar-actions { display:flex; align-items:center; gap:12px; }
    .roleswitch { display:flex; gap:2px; background:var(--surface-2); padding:3px; border-radius:var(--radius-sm); }
    .roleswitch button { border:none; background:none; padding:6px 14px; border-radius:5px; font-size:13px; font-weight:500; color:var(--text-muted); cursor:pointer; font-family:inherit; transition:.15s; }
    .roleswitch button.active { background:var(--surface); color:var(--text); box-shadow:var(--shadow-sm); }
    .content { padding:28px; overflow-y:auto; }

    /* ============ COMPONENTS ============ */
    .stack { display:flex; flex-direction:column; gap:26px; }
    .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow-sm); }
    .section-title { font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--text-subtle); margin:0 0 12px; }
    .tag { display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px; font-size:11px; font-weight:600; text-transform:capitalize; }
    .tag::before { content:''; width:6px; height:6px; border-radius:50%; background:currentColor; }
    .tag.public { color:var(--public); background:var(--public-soft); }
    .tag.internal { color:var(--internal); background:var(--internal-soft); }
    .tag.restricted { color:var(--restricted); background:var(--restricted-soft); }
    .resolved { display:grid; grid-template-columns:repeat(4,1fr); overflow:hidden; }
    .resolved > div { padding:16px 18px; border-right:1px solid var(--border); }
    .resolved > div:last-child { border-right:none; }
    .resolved .k { font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-subtle); margin-bottom:6px; }
    .resolved .v { font-size:14px; font-weight:600; }
    .resolved .v.mono { font-family:var(--font-mono); font-weight:500; font-size:13px; color:var(--accent); }
    .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
    .stat { padding:18px; }
    .stat .label { font-size:13px; color:var(--text-muted); display:flex; align-items:center; gap:6px; }
    .stat .num { font-size:30px; font-weight:700; letter-spacing:-.02em; margin-top:6px; }
    .stat .num small { font-size:15px; font-weight:500; color:var(--text-subtle); }
    .stat.locked { opacity:.5; }
    .lock { width:13px; height:13px; }
    .activity-row { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--border); font-size:13px; }
    .activity-row:last-child { border-bottom:none; }
    .activity-row .act { font-family:var(--font-mono); font-size:11px; font-weight:600; padding:2px 7px; border-radius:4px; background:var(--surface-2); color:var(--text-muted); }
    .activity-row .tgt { font-weight:500; }
    .activity-row .ts { margin-left:auto; color:var(--text-subtle); font-size:12px; font-family:var(--font-mono); }

    /* ============ TABLE & BANNER ============ */
    .table { width:100%; border-collapse:collapse; }
    .table thead th { text-align:left; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--text-subtle); padding:0 16px 10px; border-bottom:1px solid var(--border); }
    .table .num-col { width:44px; }
    .table tbody td { padding:14px 16px; border-bottom:1px solid var(--border); font-size:14px; vertical-align:middle; }
    .table tbody tr:last-child td { border-bottom:none; }
    .table tbody tr:hover { background:var(--surface-2); }
    .table .name { font-weight:600; }
    .table .desc { color:var(--text-muted); font-size:13px; }
    .table td.num-col { font-family:var(--font-mono); color:var(--text-subtle); font-size:13px; }
    .banner { display:flex; align-items:center; gap:10px; padding:11px 15px; border-radius:var(--radius); background:var(--surface-2); border:1px solid var(--border); color:var(--text-muted); font-size:13px; font-weight:500; margin-bottom:18px; }
    .banner svg { width:15px; height:15px; flex-shrink:0; color:var(--text-subtle); }
    .banner b { color:var(--text); }
    .empty { text-align:center; padding:44px 20px; color:var(--text-subtle); font-size:14px; }

    /* ============ BUTTONS, TOOLBAR, ACTIONS ============ */
    .btn { display:inline-flex; align-items:center; gap:7px; padding:8px 14px; border-radius:var(--radius-sm); font-family:inherit; font-size:13px; font-weight:600; cursor:pointer; border:1px solid transparent; transition:background .15s,border-color .15s,opacity .15s; }
    .btn svg { width:15px; height:15px; }
    .btn-primary { background:var(--accent); color:#fff; }
    .btn-primary:hover { background:var(--accent-hover); }
    .btn-ghost { background:var(--surface); color:var(--text-muted); border-color:var(--border); }
    .btn-ghost:hover { background:var(--surface-2); color:var(--text); }
    .btn:disabled { opacity:.45; cursor:not-allowed; }
    .toolbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; gap:12px; }
    .search { display:flex; align-items:center; gap:8px; padding:8px 12px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); min-width:260px; }
    .search svg { width:15px; height:15px; color:var(--text-subtle); flex-shrink:0; }
    .search input { border:none; outline:none; background:none; font-family:inherit; font-size:13px; color:var(--text); width:100%; }
    .row-actions { display:flex; gap:6px; justify-content:flex-end; }
    .icon-btn { display:grid; place-items:center; width:30px; height:30px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--surface); color:var(--text-muted); cursor:pointer; transition:.15s; }
    .icon-btn:hover { background:var(--surface-2); color:var(--text); }
    .icon-btn.danger:hover { background:var(--restricted-soft); color:var(--restricted); border-color:var(--restricted); }
    .icon-btn svg { width:15px; height:15px; }

    /* ============ MODAL ============ */
    .modal-overlay { position:fixed; inset:0; background:rgba(16,24,40,.45); display:flex; align-items:center; justify-content:center; padding:24px; z-index:100; opacity:0; pointer-events:none; transition:opacity .18s; }
    .modal-overlay.open { opacity:1; pointer-events:auto; }
    .modal { background:var(--surface); border-radius:var(--radius-lg); box-shadow:0 20px 50px rgba(16,24,40,.25); width:100%; max-width:460px; transform:translateY(8px); transition:transform .18s; }
    .modal-overlay.open .modal { transform:none; }
    .modal-head { padding:20px 22px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
    .modal-title { font-size:16px; font-weight:600; }
    .modal-body { padding:22px; display:flex; flex-direction:column; gap:16px; }
    .modal-foot { padding:16px 22px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:10px; }
    .field label { display:block; font-size:12px; font-weight:600; color:var(--text-muted); margin-bottom:6px; }
    .field input, .field select, .field textarea { width:100%; padding:9px 12px; border:1px solid var(--border); border-radius:var(--radius-sm); font-family:inherit; font-size:14px; color:var(--text); background:var(--surface); outline:none; transition:border-color .15s,box-shadow .15s; }
    .field input:focus, .field select:focus, .field textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
    .field textarea { resize:vertical; min-height:64px; }
    .close-btn { border:none; background:none; cursor:pointer; color:var(--text-subtle); display:grid; place-items:center; padding:5px; border-radius:6px; }
    .close-btn:hover { background:var(--surface-2); color:var(--text); }
    .close-btn svg { width:18px; height:18px; }

    @media (max-width:820px) {
      .app { grid-template-columns:1fr; }
      .sidebar { flex-direction:row; align-items:center; gap:6px; padding:10px 12px;
        border-right:none; border-bottom:1px solid var(--border); overflow-x:auto; }
      .brand { padding:0 8px 0 4px; flex-shrink:0; }
      .nav { flex-direction:row; gap:4px; }
      .nav-label { display:none; }
      .nav-item { width:auto; white-space:nowrap; padding:8px 12px; }
      .sidebar-footer { display:none; }
      .resolved { grid-template-columns:1fr; }
      .resolved > div { border-right:none; border-bottom:1px solid var(--border); }
      .resolved > div:last-child { border-bottom:none; }
      .stats { grid-template-columns:repeat(2,1fr); }
      .topbar { padding:14px 16px; flex-wrap:wrap; gap:10px; }
      .content { padding:18px 16px; }
      .table { min-width:560px; }
    }
    @media (max-width:460px) {
      .stats { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-name">Internal Tools</div>
      </div>
      <nav class="nav">
        <div class="nav-label">Console</div>
        <button class="nav-item active" data-view="overview">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Overview
        </button>
        <button class="nav-item" data-view="registry">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3"/></svg>
          Registry
        </button>
        <button class="nav-item" data-view="audit">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h4"/></svg>
          Audit Log
        </button>
      </nav>
      <div class="sidebar-footer">
        <div class="identity">
          <div class="avatar">YA</div>
          <div>
            <div class="identity-name">Yosia A.</div>
            <div class="identity-role">Administrator</div>
          </div>
        </div>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div>
          <div class="page-title">Overview</div>
          <div class="page-sub">Governed access to operational data</div>
        </div>
        <div class="topbar-actions">
          <div class="roleswitch">
            <button class="active" data-role="admin">Admin</button>
            <button data-role="po">PO</button>
            <button data-role="viewer">Viewer</button>
          </div>
          <button class="icon-btn" id="themeToggle" title="Ganti tema"></button>
        </div>
      </header>
      <div class="content"></div>
    </main>
  </div>

  <!-- MODAL -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-head">
        <div class="modal-title" id="modalTitle">Tambah Produk</div>
        <button class="close-btn" id="modalClose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="modal-body">
        <div class="field"><label for="f_name">Nama Produk</label><input id="f_name" type="text" placeholder="mis. Server Backup B2"></div>
        <div class="field"><label for="f_desc">Deskripsi</label><textarea id="f_desc" placeholder="Deskripsi singkat"></textarea></div>
        <div class="field"><label for="f_tier">Visibilitas</label>
          <select id="f_tier">
            <option value="public">Public — terlihat semua orang</option>
            <option value="internal">Internal — staf terverifikasi</option>
            <option value="restricted">Restricted — admin saja</option>
          </select>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" id="modalCancel">Batal</button>
        <button class="btn btn-primary" id="modalSave">Simpan</button>
      </div>
    </div>
  </div>

  <script>
    /* ============ DATA ============ */
    const PRODUCTS = [
      { id:1, name:'Dell PowerEdge R750',   desc:'Server rackmount performa tinggi.', tier:'public' },
      { id:2, name:'Cisco Catalyst 9200',   desc:'Switch managed Layer-3.',            tier:'public' },
      { id:3, name:'MacBook Pro M3 Max',     desc:'Laptop lead developer.',             tier:'public' },
      { id:4, name:'Logitech MX Master 3S',  desc:'Mouse wireless.',                    tier:'public' },
      { id:5, name:'Konfigurasi VPN Kantor', desc:'Profil akses jaringan internal.',    tier:'internal' },
      { id:6, name:'Playbook Deployment',    desc:'Prosedur rilis produksi.',           tier:'internal' },
      { id:7, name:'Root Credentials Vault', desc:'Kredensial root infrastruktur.',     tier:'restricted' },
      { id:8, name:'AWS Production Keys',    desc:'Kunci akses cloud produksi.',        tier:'restricted' },
    ];
    const AUDIT = [
      { ts:'2026-09-10 14:32', actor:'Yosia A.', action:'CREATE', target:'AWS Production Keys',  tier:'restricted' },
      { ts:'2026-09-10 11:07', actor:'Yosia A.', action:'UPDATE', target:'Cisco Catalyst 9200',  tier:'public' },
      { ts:'2026-09-09 16:45', actor:'Rani P.',  action:'CREATE', target:'Playbook Deployment',   tier:'internal' },
    ];

    /* ============ RBAC ENGINE ============ */
    const ROLES = {
      admin:  { label:'Administrator', group:'app:tools:admin',  canCRUD:true,  tiers:['public','internal','restricted'] },
      po:     { label:'Product Owner', group:'app:tools:po',     canCRUD:true,  tiers:['public','internal'] },
      viewer: { label:'Viewer',        group:'app:tools:viewer', canCRUD:false, tiers:['public'] },
    };
    const VIEWS = {
      overview: { title:'Overview',  sub:'Governed access to operational data' },
      registry: { title:'Registry',  sub:'Inventaris produk dengan visibilitas berjenjang' },
      audit:    { title:'Audit Log', sub:'Rekam jejak perubahan' },
    };

    /* ============ STATE ============ */
    const state = { role:'admin', view:'overview' };
    let editingId = null;
    let searchQuery = '';
    let nextId = Math.max.apply(null, PRODUCTS.map(p => p.id)) + 1;

    const rbac = () => ROLES[state.role];
    const visibleProducts = () => PRODUCTS.filter(p => rbac().tiers.includes(p.tier));

    /* ============ HELPERS ============ */
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    const tierTag = (tier) => `<span class="tag ${tier}">${tier}</span>`;
    const countTier = (tier) => PRODUCTS.filter(p => p.tier === tier).length;
    const pad = (n) => String(n).padStart(2, '0');
    const now = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
    const logAudit = (action, target, tier) => AUDIT.unshift({ ts: now(), actor:'Yosia A.', action, target, tier });

    const lockSvg   = `<svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>`;
    const plusSvg   = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`;
    const editSvg   = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`;
    const trashSvg  = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>`;
    const searchSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>`;
    const sunSvg    = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`;
    const moonSvg   = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>`;

    /* ============ RENDER: CHROME ============ */
    function renderChrome() {
      document.querySelectorAll('[data-role]').forEach(b => b.classList.toggle('active', b.dataset.role === state.role));
      document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('active', b.dataset.view === state.view));
      document.querySelector('.page-title').textContent = VIEWS[state.view].title;
      document.querySelector('.page-sub').textContent   = VIEWS[state.view].sub;
      document.querySelector('.identity-role').textContent = rbac().label;
    }

    /* ============ RENDER: OVERVIEW ============ */
    function renderOverview() {
      const r = rbac();
      const tierCards = ['public','internal','restricted'].map(tier => {
        const canSee = r.tiers.includes(tier);
        return `<div class="card stat ${canSee ? '' : 'locked'}">
          <div class="label">${tier[0].toUpperCase()+tier.slice(1)} ${canSee ? '' : lockSvg}</div>
          <div class="num">${canSee ? countTier(tier) : '—'}</div>
        </div>`;
      }).join('');
      return `<div class="stack">
        <section>
          <div class="section-title">Resolved Access</div>
          <div class="card resolved">
            <div><div class="k">Identity</div><div class="v">Yosia A.</div></div>
            <div><div class="k">Role</div><div class="v">${r.label}</div></div>
            <div><div class="k">OIDC Group</div><div class="v mono">${r.group}</div></div>
            <div><div class="k">Permissions</div><div class="v">${r.canCRUD ? 'Read · Write' : 'Read only'}</div></div>
          </div>
        </section>
        <section>
          <div class="section-title">Inventory by tier</div>
          <div class="stats">
            <div class="card stat">
              <div class="label">Total visible</div>
              <div class="num">${visibleProducts().length}<small> / ${PRODUCTS.length}</small></div>
            </div>
            ${tierCards}
          </div>
        </section>
        <section>
          <div class="section-title">Recent activity</div>
          <div class="card" style="padding:2px 18px;">
            ${AUDIT.slice(0,6).map(a => `<div class="activity-row">
              <span class="act">${a.action}</span>
              <span class="tgt">${esc(a.target)}</span>
              ${tierTag(a.tier)}
              <span class="ts">${a.ts}</span>
            </div>`).join('')}
          </div>
        </section>
      </div>`;
    }

    /* ============ RENDER: REGISTRY ============ */
    function renderRegistry() {
      const r = rbac();
      let rows = visibleProducts();
      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        rows = rows.filter(p => p.name.toLowerCase().includes(q) || (p.desc||'').toLowerCase().includes(q));
      }
      const hidden = PRODUCTS.length - visibleProducts().length;
      const banner = hidden > 0
        ? `<div class="banner">${lockSvg}<span><b>${hidden}</b> item disembunyikan oleh level aksesmu (${r.label}).</span></div>`
        : '';
      const addBtn = r.canCRUD ? `<button class="btn btn-primary" data-action="add">${plusSvg} Tambah Produk</button>` : '<span></span>';
      const colspan = r.canCRUD ? 5 : 4;
      const body = rows.length ? rows.map((p,i) => `<tr>
        <td class="num-col">${i+1}</td>
        <td class="name">${esc(p.name)}</td>
        <td class="desc">${esc(p.desc) || '—'}</td>
        <td>${tierTag(p.tier)}</td>
        ${r.canCRUD ? `<td><div class="row-actions">
          <button class="icon-btn" data-action="edit" data-id="${p.id}" title="Edit">${editSvg}</button>
          <button class="icon-btn danger" data-action="delete" data-id="${p.id}" title="Hapus">${trashSvg}</button>
        </div></td>` : ''}
      </tr>`).join('') : `<tr><td colspan="${colspan}"><div class="empty">Tidak ada produk yang cocok.</div></td></tr>`;
      return `${banner}
        <div class="toolbar">
          <div class="search">${searchSvg}<input id="searchInput" type="text" placeholder="Cari produk..." value="${esc(searchQuery)}"></div>
          ${addBtn}
        </div>
        <div class="card" style="padding:8px 8px 4px;overflow-x:auto;">
          <table class="table">
            <thead><tr>
              <th class="num-col">#</th><th>Produk</th><th>Deskripsi</th><th>Visibilitas</th>${r.canCRUD ? '<th style="text-align:right;">Aksi</th>' : ''}
            </tr></thead>
            <tbody>${body}</tbody>
          </table>
        </div>`;
    }

    /* ============ RENDER: AUDIT ============ */
    function renderAudit() {
      return `<div class="card" style="padding:8px 8px 4px;overflow-x:auto;">
        <table class="table">
          <thead><tr><th>Waktu</th><th>Aktor</th><th>Aksi</th><th>Target</th><th>Tier</th></tr></thead>
          <tbody>
            ${AUDIT.map(a => `<tr>
              <td class="num-col" style="width:auto;white-space:nowrap;">${a.ts}</td>
              <td class="name">${esc(a.actor)}</td>
              <td><span class="act">${a.action}</span></td>
              <td>${esc(a.target)}</td>
              <td>${tierTag(a.tier)}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>`;
    }

    /* ============ RENDER: DISPATCH ============ */
    function renderView() {
      const el = document.querySelector('.content');
      if (state.view === 'overview') {
        el.innerHTML = renderOverview();
      } else if (state.view === 'registry') {
        el.innerHTML = renderRegistry();
        const si = document.getElementById('searchInput');
        if (si) {
          si.addEventListener('input', e => { searchQuery = e.target.value; render(); });
          if (searchQuery) { si.focus(); si.setSelectionRange(si.value.length, si.value.length); }
        }
      } else {
        el.innerHTML = renderAudit();
      }
    }

    function render() { renderChrome(); renderView(); }

    /* ============ CRUD ============ */
    function openModal(id) {
      editingId = id;
      document.getElementById('modalTitle').textContent = id ? 'Edit Produk' : 'Tambah Produk';
      const n = document.getElementById('f_name'), d = document.getElementById('f_desc'), t = document.getElementById('f_tier');
      if (id) { const p = PRODUCTS.find(x => x.id === id); n.value = p.name; d.value = p.desc; t.value = p.tier; }
      else { n.value = ''; d.value = ''; t.value = 'public'; }
      document.getElementById('modalOverlay').classList.add('open');
      setTimeout(() => n.focus(), 50);
    }
    function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); editingId = null; }
    function saveProduct() {
      if (!rbac().canCRUD) return;
      const name = document.getElementById('f_name').value.trim();
      const desc = document.getElementById('f_desc').value.trim();
      const tier = document.getElementById('f_tier').value;
      if (!name) { document.getElementById('f_name').focus(); return; }
      if (editingId) {
        const p = PRODUCTS.find(x => x.id === editingId);
        p.name = name; p.desc = desc; p.tier = tier;
        logAudit('UPDATE', name, tier);
      } else {
        PRODUCTS.push({ id: nextId++, name, desc, tier });
        logAudit('CREATE', name, tier);
      }
      closeModal(); render();
    }
    function deleteProduct(id) {
      if (!rbac().canCRUD) return;
      const p = PRODUCTS.find(x => x.id === id);
      if (!p || !confirm(`Hapus "${p.name}"?`)) return;
      PRODUCTS.splice(PRODUCTS.indexOf(p), 1);
      logAudit('DELETE', p.name, p.tier);
      render();
    }

    /* ============ EVENTS ============ */
    document.querySelectorAll('[data-role]').forEach(b => b.addEventListener('click', () => { state.role = b.dataset.role; searchQuery=''; render(); }));
    document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => { state.view = b.dataset.view; render(); }));
    document.querySelector('.content').addEventListener('click', e => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      const a = btn.dataset.action;
      if (a === 'add') openModal(null);
      else if (a === 'edit') openModal(Number(btn.dataset.id));
      else if (a === 'delete') deleteProduct(Number(btn.dataset.id));
    });
    document.getElementById('modalClose').addEventListener('click', closeModal);
    document.getElementById('modalCancel').addEventListener('click', closeModal);
    document.getElementById('modalSave').addEventListener('click', saveProduct);
    document.getElementById('modalOverlay').addEventListener('click', e => { if (e.target.id === 'modalOverlay') closeModal(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    /* ============ THEME ============ */
    const themeBtn = document.getElementById('themeToggle');
    function setThemeIcon() { themeBtn.innerHTML = document.documentElement.getAttribute('data-theme') === 'dark' ? sunSvg : moonSvg; }
    (function initTheme(){ let t='light'; try { t = localStorage.getItem('lumen-theme') || 'light'; } catch(e){} if (t === 'dark') document.documentElement.setAttribute('data-theme','dark'); setThemeIcon(); })();
    themeBtn.addEventListener('click', () => {
      const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      if (next === 'dark') document.documentElement.setAttribute('data-theme','dark');
      else document.documentElement.removeAttribute('data-theme');
      try { localStorage.setItem('lumen-theme', next); } catch(e){}
      setThemeIcon();
    });

    render();
  </script>
</body>
</html>
